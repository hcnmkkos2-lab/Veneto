<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>إدارة فينيتو | VENETO</title>
  <style>
    :root {
      --cream: #fff8ee;
      --coffee: #503628;
      --gold: #d8aa45;
      --ink: #39251c;
      --muted: #806e60;
      --line: #eadfce;
      --paper: #fffdf9;
      --danger: #a8322a;
      --success: #1b7044;
      --shadow: 0 12px 28px rgba(80,54,40,.12);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; font-family: Arial, sans-serif; background: var(--cream); color: var(--ink); }
    body { padding: 20px; }
    .wrap { width: min(100%, 980px); margin: 0 auto; }
    .box {
      background: var(--paper); border: 1px solid var(--line); border-radius: 18px; padding: 18px; box-shadow: var(--shadow);
      margin-bottom: 18px;
    }
    h1, h2, h3, p { margin: 0 0 10px; }
    .muted { color: var(--muted); }
    .error { color: var(--danger); min-height: 22px; }
    .success { color: var(--success); min-height: 22px; }
    .hidden { display: none !important; }
    .auth-shell {
      max-width: 430px; margin: 24px auto;
    }
    form { display: grid; gap: 12px; }
    label { display: grid; gap: 8px; font-weight: 600; }
    input {
      width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: white; font: inherit;
      outline: none;
    }
    input:focus { border-color: var(--coffee); box-shadow: 0 0 0 3px rgba(80,54,40,.08); }
    button {
      border: none; border-radius: 12px; padding: 12px 16px; background: var(--coffee); color: #fff; font: inherit; font-weight: 700; cursor: pointer;
    }
    button.secondary { background: #fff; color: var(--coffee); border: 1px solid var(--line); }
    .row { display: flex; gap: 10px; flex-wrap: wrap; }
    .text-btn { background: transparent; color: var(--coffee); border: none; padding: 0; font-weight: 700; }
    .dashboard-tools { display: flex; flex-wrap: wrap; gap: 10px; }
    .table-wrap { overflow: auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: right; padding: 10px; border-bottom: 1px solid var(--line); }
    @media (max-width: 640px) {
      body { padding: 14px; }
      .box { padding: 14px; }
      button, input { font-size: 16px; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section id="auth" class="box auth-shell">
      <h1>لوحة إدارة فينيتو</h1>
      <p class="muted">الدخول إلى لوحة الإدارة</p>
      <div id="auth-message" class="error" aria-live="polite"></div>

      <form id="login-form">
        <label>
          البريد الإلكتروني
          <input type="email" id="login-email" name="email" autocomplete="username" required>
        </label>
        <label>
          كلمة المرور
          <input type="password" id="login-password" name="password" autocomplete="current-password" required>
        </label>
        <button type="submit">تسجيل الدخول</button>
        <div class="muted">لا تملك حسابًا؟ <button type="button" class="text-btn" id="show-setup">التسجيل لأول مرة</button></div>
      </form>

      <form id="setup-form" class="hidden">
        <label>
          البريد الإلكتروني
          <input type="email" id="setup-email" name="email" autocomplete="email" required>
        </label>
        <label>
          كلمة المرور
          <input type="password" id="setup-password" name="password" autocomplete="new-password" minlength="12" required>
        </label>
        <label>
          تأكيد كلمة المرور
          <input type="password" id="setup-confirm" name="confirmPassword" autocomplete="new-password" minlength="12" required>
        </label>
        <label>
          رمز الإعداد السري
          <input type="password" id="setup-token" name="setupToken" autocomplete="off" required>
        </label>
        <button type="submit">تسجيل حساب المدير</button>
        <div class="muted">لديك حساب بالفعل؟ <button type="button" class="text-btn" id="show-login">تسجيل الدخول</button></div>
      </form>
    </section>

    <section id="dashboard" class="hidden">
      <header class="box">
        <div class="row" style="justify-content:space-between;align-items:center;">
          <div>
            <h1>إدارة فينيتو</h1>
            <span id="who" class="muted"></span>
          </div>
          <div class="dashboard-tools">
            <button id="refresh">تحديث</button>
            <button id="logout" class="secondary">تسجيل الخروج</button>
          </div>
        </div>
      </header>

      <section id="owner" class="box">
        <h2>إعدادات المدير الأساسي</h2>
        <form id="owner-credentials-form">
          <label>البريد الإلكتروني الجديد (اختياري)
            <input type="email" name="email" autocomplete="email">
          </label>
          <label>كلمة المرور الحالية
            <input type="password" name="currentPassword" autocomplete="current-password" required>
          </label>
          <label>كلمة المرور الجديدة (اختياري، 12 خانة على الأقل)
            <input type="password" name="newPassword" minlength="12" autocomplete="new-password">
          </label>
          <button type="submit">حفظ بيانات المدير</button>
        </form>
        <div id="owner-message" class="success"></div>
      </section>

      <section class="box">
        <h2>الإدارة الفنية</h2>
        <div id="pin-lock">
          <p class="muted">تحتاج إلى الرمز الفني المكون من 8 أرقام للوصول إلى إدارة المنتجات والمناطق.</p>
          <form id="technical-pin-form">
            <label>الرمز الفني
              <input type="text" name="pin" inputmode="numeric" pattern="[0-9]{8}" maxlength="8" required>
            </label>
            <button type="submit">فتح الإدارة الفنية</button>
          </form>
        </div>
      </section>
    </section>
  </main>

  <script>
    const auth = document.getElementById('auth');
    const dashboard = document.getElementById('dashboard');
    const loginForm = document.getElementById('login-form');
    const setupForm = document.getElementById('setup-form');
    const authMessage = document.getElementById('auth-message');
    const who = document.getElementById('who');

    function setMessage(text, type = 'error') {
      authMessage.textContent = text || '';
      authMessage.className = type === 'success' ? 'success' : 'error';
    }

    async function requestJson(url, options = {}) {
      const response = await fetch(url, {
        credentials: 'same-origin',
        ...options,
        headers: {
          ...(options.headers || {}),
          ...(options.body ? { 'content-type': 'application/json' } : {})
        }
      });
      const result = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(result.error || 'تعذر إكمال الطلب.');
      return result;
    }

    async function csrfToken() {
      const data = await requestJson('/api/csrf');
      return data.csrfToken;
    }

    function showLogin() {
      loginForm.classList.remove('hidden');
      setupForm.classList.add('hidden');
      setMessage('');
    }

    function showSetup() {
      loginForm.classList.add('hidden');
      setupForm.classList.remove('hidden');
      setMessage('');
    }

    document.getElementById('show-setup').addEventListener('click', showSetup);
    document.getElementById('show-login').addEventListener('click', showLogin);

    loginForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      const form = event.currentTarget;
      const email = form.email.value.trim();
      const password = form.password.value;
      const button = form.querySelector('button[type="submit"]');
      button.disabled = true;
      setMessage('جارٍ تسجيل الدخول…', 'success');
      try {
        const csrf = await csrfToken();
        const result = await requestJson('/api/login', {
          method: 'POST',
          headers: { 'x-csrf-token': csrf },
          body: JSON.stringify({ email, password })
        });
        if (result.error) throw new Error(result.error);
        setMessage('تم تسجيل الدخول بنجاح.', 'success');
        await loadDashboard();
      } catch (error) {
        setMessage(error.message || 'تعذر تسجيل الدخول.');
      } finally {
        button.disabled = false;
      }
    });

    setupForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      const form = event.currentTarget;
      const email = form.email.value.trim();
      const password = form.password.value;
      const confirmPassword = form.confirmPassword.value;
      const setupToken = form.setupToken.value.trim();
      if (password.length < 12) {
        setMessage('كلمة المرور يجب ألا تقل عن 12 حرفًا.');
        return;
      }
      if (password !== confirmPassword) {
        setMessage('تأكيد كلمة المرور غير متطابق.');
        return;
      }
      const button = form.querySelector('button[type="submit"]');
      button.disabled = true;
      setMessage('جارٍ إنشاء حساب المدير…', 'success');
      try {
        const csrf = await csrfToken();
        const result = await requestJson('/api/setup/claim', {
          method: 'POST',
          headers: { 'x-csrf-token': csrf },
          body: JSON.stringify({ email, password, confirmPassword, setupToken })
        });
        if (result.error) throw new Error(result.error);
        await requestJson('/api/login', {
          method: 'POST',
          headers: { 'x-csrf-token': csrf },
          body: JSON.stringify({ email, password })
        });
        setMessage('تم إنشاء حساب المدير وتسجيل دخوله بنجاح.', 'success');
        await loadDashboard();
      } catch (error) {
        setMessage(error.message || 'تعذر إنشاء حساب المدير.');
      } finally {
        button.disabled = false;
      }
    });

    async function loadDashboard() {
      try {
        const session = await requestJson('/api/session');
        who.textContent = session.email || 'مدير';
        auth.classList.add('hidden');
        dashboard.classList.remove('hidden');
        const ownerMessage = document.getElementById('owner-message');
        ownerMessage.textContent = 'أنت الآن داخل لوحة الإدارة.';
      } catch (error) {
        auth.classList.remove('hidden');
        dashboard.classList.add('hidden');
        setMessage(error.message || 'انتهت الجلسة، سجّل الدخول من جديد.');
      }
    }

    document.getElementById('refresh').addEventListener('click', loadDashboard);

    document.getElementById('logout').addEventListener('click', async () => {
      try {
        const csrf = await csrfToken();
        await requestJson('/api/logout', {
          method: 'POST',
          headers: { 'x-csrf-token': csrf }
        });
        location.reload();
      } catch (error) {
        setMessage(error.message || 'تعذر تسجيل الخروج.');
      }
    });

    document.getElementById('owner-credentials-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const form = event.currentTarget;
      const formData = new FormData(form);
      const email = String(formData.get('email') || '').trim();
      const currentPassword = String(formData.get('currentPassword') || '');
      const newPassword = String(formData.get('newPassword') || '');
      if (!email && !newPassword) {
        document.getElementById('owner-message').textContent = 'أدخل بريدًا جديدًا أو كلمة مرور جديدة.';
        return;
      }
      try {
        const csrf = await csrfToken();
        const result = await requestJson('/api/admin/owner-credentials', {
          method: 'POST',
          headers: { 'x-csrf-token': csrf },
          body: JSON.stringify({ email, currentPassword, newPassword })
        });
        document.getElementById('owner-message').textContent = result.message || 'تم تحديث بيانات المدير.';
        form.reset();
      } catch (error) {
        document.getElementById('owner-message').textContent = error.message || 'تعذر تحديث بيانات المدير.';
      }
    });

    document.getElementById('technical-pin-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const pin = event.currentTarget.pin.value.trim();
      try {
        const csrf = await csrfToken();
        await requestJson('/api/technical/unlock', {
          method: 'POST',
          headers: { 'x-csrf-token': csrf },
          body: JSON.stringify({ pin })
        });
        document.getElementById('pin-lock').innerHTML = '<p class="success">تم فتح الإدارة الفنية بنجاح.</p>';
      } catch (error) {
        document.getElementById('pin-lock').innerHTML = '<p class="error">' + error.message + '</p>';
      }
    });

    async function bootstrap() {
      try {
        const status = await requestJson('/api/setup/status');
        if (status && status.setupRequired) {
          showSetup();
        } else {
          showLogin();
          try {
            await loadDashboard();
          } catch (error) {
            showLogin();
          }
        }
      } catch (error) {
        setMessage(error.message || 'تعذر الاتصال بالخادم.');
      }
    }

    bootstrap();
  </script>
</body>
</html>
