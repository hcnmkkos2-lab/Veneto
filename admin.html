<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة فينيتو | VENETO</title><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
:root{--cream:#fff8ee;--coffee:#503628;--gold:#d8aa45;--ink:#39251c;--muted:#806e60;--line:#eadfce;--paper:#fffdf9}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Tajawal,sans-serif}.wrap{max-width:1180px;margin:24px auto;padding:0 16px}.box{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:15px}.head,.row,.tools{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}h1{color:var(--coffee)}button{cursor:pointer;border:0;border-radius:9px;padding:10px 14px;background:var(--coffee);color:white;font:600 15px Tajawal}input,select{padding:10px;border:1px solid var(--line);border-radius:9px;font:inherit;max-width:100%}.form{display:grid;gap:10px;max-width:500px}.form label{display:grid;gap:5px}.hidden{display:none!important}.tabs{display:flex;gap:8px;overflow:auto;margin:12px 0}.tabs button{white-space:nowrap}.tabs .active{background:var(--gold);color:#322116}.order{border-top:1px solid var(--line);padding:13px 0;display:grid;gap:7px}.muted{color:var(--muted);font-size:14px}.error{color:#a32920}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:9px}.line{border-top:1px solid var(--line);padding:9px 0;display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:7px;align-items:center}.pin{max-width:190px;letter-spacing:5px}@media(max-width:600px){.line{grid-template-columns:1fr 1fr}.wrap{margin:10px auto}}
</style></head><body><main class="wrap">
<section id="auth" class="box"><h1>لوحة إدارة فينيتو</h1><p class="muted">دخول المديرين.</p><div id="msg" class="error"></div><form id="setup" class="form hidden"><h2>إنشاء المدير الأساسي</h2><p class="muted">البريد يجب أن يطابق OWNER_EMAIL ورمز التهيئة المؤقت.</p><label>البريد<input type="email" name="email" required></label><label>رمز التهيئة<input name="setupToken" required></label><label>كلمة المرور (12 خانة على الأقل)<input type="password" name="password" minlength="12" required></label><button>إنشاء الحساب الأساسي</button></form><form id="login" class="form"><h2>تسجيل الدخول</h2><label>البريد الإلكتروني<input type="email" name="email" required autocomplete="username"></label><label>كلمة المرور<input type="password" name="password" required autocomplete="current-password"></label><button>دخول</button></form><form id="invite" class="form hidden"><h2>قبول دعوة المدير</h2><label>البريد<input type="email" name="email" required></label><label>رمز الدعوة<input name="token" required></label><label>كلمة المرور (12 خانة على الأقل)<input type="password" name="password" minlength="12" required></label><button>إنشاء الحساب</button></form></section>
<section id="dashboard" class="hidden"><header class="box head"><div><h1>إدارة فينيتو</h1><span id="who" class="muted"></span></div><div class="tools"><button id="refresh">��حديث</button><button id="logout">تسجيل الخروج</button></div></header><section class="box"><div class="tabs"><button class="status active" data-status="new">الطلبات الجديدة</button><button class="status" data-status="preparing">قيد التجهيز</button><button class="status" data-status="delivered">تم التسليم</button><button class="status" data-status="cancelled">ملغاة</button><button class="status" data-status="all">الكل</button></div><div id="orders"></div></section>
<section id="owner" class="box"><h2>إعدادات المدير الأساسي</h2><form id="invite-admin" class="tools"><input type="email" name="email" placeholder="بريد المدير المفوض" required><button>إنشاء دعوة لمرة واحدة</button></form><p id="invitation" class="muted"></p><form id="pin-form" class="tools"><input class="pin" name="pin" inputmode="numeric" pattern="[0-9]{8}" maxlength="8" placeholder="رمز فني 8 أرقام" required><button>حفظ الرمز الفني</button></form><p id="owner-msg"></p></section>
<section class="box"><h2>الإدارة الفنية</h2><div id="pin-lock"><p class="muted">الدخول يتطلب رمز المدير الفني المكون من 8 أرقام.</p><form id="unlock" class="tools"><input class="pin" name="pin" type="password" inputmode="numeric" pattern="[0-9]{8}" maxlength="8" required placeholder="••••••••"><button>فتح</button></form></div><div id="tech" class="hidden"><div class="tabs"><button class="tech-tab active" data-pane="products">المنتجات</button><button class="tech-tab" data-pane="areas">مناطق التوصيل</button><button class="tech-tab" data-pane="audit">سجل العمليات</button></div><div id="pane-products"><h3>إضافة منتج</h3><form id="new-product" class="grid"><input name="id" placeholder="معرّف لاتيني" pattern="[a-z0-9-]{2,60}" required><input name="name_ar" placeholder="اسم المنتج" required><input name="name_en" placeholder="الاسم بالإنجليزية"><select name="category"><option value="dessert">حلويات</option><option value="pastry">مخبوزات</option><option value="savory">مالح</option><option value="drink">مشروبات</option></select><input name="price_iqd" type="number" min="0" placeholder="السعر (فارغ = لاحقاً)"><input name="image_url" type="url" placeholder="رابط الصورة"><input name="description_ar" placeholder="التفاصيل"><button>إضافة</button></form><h3>المنتجات</h3><div id="products"></div></div><div id="pane-areas" class="hidden"><h3>إضافة منطقة ببغداد</h3><form id="new-area" class="tools"><input name="name_ar" placeholder="اسم المنطقة" required><select name="district"><option>الكرخ</option><option>الرصافة</option></select><input name="delivery_fee_iqd" type="number" min="0" placeholder="الأجرة (فارغ = لاحقاً)"><button>إضافة</button></form><div id="areas"></div></div><div id="pane-audit" class="hidden"></div></div></section></section></main>
<script>
let csrf='';let status='new';const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];async function api(url,opt={}){const headers={...(opt.headers||{})};if(opt.body){headers['Content-Type']='application/json';headers['X-CSRF-Token']=csrf;}const r=await fetch(url,{credentials:'same-origin',...opt,headers}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'تعذر تنفيذ الطلب');return d;}async function token(){csrf=(await api('/api/csrf')).csrfToken;}async function postForm(form,url){return api(url,{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(form)))});}function error(e){$('#msg').textContent=e.message;}
async function init(){await token();if(new URLSearchParams(location.search).has('invite'))$('#invite').classList.remove('hidden');if((await api('/api/setup/status')).setupRequired)$('#setup').classList.remove('hidden');try{show(await api('/api/session'))}catch{}}function show(me){$('#auth').classList.add('hidden');$('#dashboard').classList.remove('hidden');$('#who').textContent=me.email;$('#owner').classList.toggle('hidden',me.role!=='owner');loadOrders();}
$('#login').onsubmit=async e=>{e.preventDefault();try{const x=await postForm(e.currentTarget,'/api/login');await token();show(x)}catch(err){error(err)}};$('#setup').onsubmit=async e=>{e.preventDefault();try{const x=await postForm(e.currentTarget,'/api/setup/claim');await token();show(x)}catch(err){error(err)}};$('#invite').onsubmit=async e=>{e.preventDefault();try{const x=await postForm(e.currentTarget,'/api/invitations/accept');await token();show(x)}catch(err){error(err)}};$('#logout').onclick=async()=>{try{await api('/api/logout',{method:'POST',body:'{}'});location.reload()}catch(e){alert(e.message)}};
async function loadOrders(){const box=$('#orders');try{const rows=await api('/api/admin/orders'+(status==='all'?'':'?status='+status));box.replaceChildren();if(!rows.length){box.textContent='لا توجد طلبات حالياً.';return;}for(const o of rows){const a=document.createElement('article');a.className='order';const title=document.createElement('strong');title.textContent=`طلب ${o.id.slice(0,8)} — ${o.customer_name}`;a.append(title);const contact=document.createElement('div');contact.textContent=`${o.phone} — ${o.area_name} (${o.area_id}) — ${o.created_at}`;a.append(contact);for(const i of o.items){const l=document.createElement('div');l.textContent=`${i.name} × ${i.quantity} — ${i.unitPriceIqd==null?'السعر يحدد لاحقاً':new Intl.NumberFormat('ar-IQ').format(i.unitPriceIqd*i.quantity)+' د.ع'}`;a.append(l);}const fee=document.createElement('div');fee.textContent=`التوصيل: ${o.delivery_fee_iqd==null?'يحدد لاحقاً':new Intl.NumberFormat('ar-IQ').format(o.delivery_fee_iqd)+' د.ع'} — الإجمالي: ${o.total_iqd==null?'يحدد لاحقاً':new Intl.NumberFormat('ar-IQ').format(o.total_iqd)+' د.ع'}`;a.append(fee);const select=document.createElement('select');for(const [v,t] of [['new','جديد'],['preparing','قيد التجهيز'],['delivered','تم التسليم'],['cancelled','إلغاء']]){const op=document.createElement('option');op.value=v;op.textContent=t;select.append(op);}select.value=o.status;select.onchange=async()=>{try{await api('/api/admin/orders/'+encodeURIComponent(o.id)+'/status',{method:'PATCH',body:JSON.stringify({status:select.value})});loadOrders()}catch(e){alert(e.message)}};a.append(select);box.append(a);}}catch(e){box.textContent=e.message;}}
$$('.status').forEach(b=>b.onclick=()=>{$$('.status').forEach(x=>x.classList.remove('active'));b.classList.add('active');status=b.dataset.status;loadOrders()});$('#refresh').onclick=loadOrders;setInterval(()=>{if(!$('#dashboard').classList.contains('hidden'))loadOrders()},20000);
$('#invite-admin').onsubmit=async e=>{e.preventDefault();try{const x=await postForm(e.currentTarget,'/api/admin/invitations');$('#invitation').textContent=`رمز الدعوة لمرة واحدة: ${x.invitationToken} — صالح 24 ساعة. رابط: ${location.origin}/admin?invite=1`;e.currentTarget.reset()}catch(x){$('#owner-msg').textContent=x.message}};$('#pin-form').onsubmit=async e=>{e.preventDefault();try{await postForm(e.currentTarget,'/api/admin/technical-pin');$('#owner-msg').textContent='تم حفظ الرمز الفني مشفراً.';e.currentTarget.reset()}catch(x){$('#owner-msg').textContent=x.message}};$('#unlock').onsubmit=async e=>{e.preventDefault();try{await postForm(e.currentTarget,'/api/technical/unlock');$('#pin-lock').classList.add('hidden');$('#tech').classList.remove('hidden');loadProducts();loadAreas()}catch(x){$('#owner-msg').textContent=x.message}};
$$('.tech-tab').forEach(b=>b.onclick=()=>{$$('.tech-tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');for(const p of ['products','areas','audit'])$('#pane-'+p).classList.toggle('hidden',p!==b.dataset.pane);if(b.dataset.pane==='audit')loadAudit()});
async function loadProducts(){const box=$('#products');try{const rows=await api('/api/technical/products');box.replaceChildren();for(const p of rows){const f=document.createElement('form');f.className='line';f.innerHTML='<input name="name_ar"><input name="price_iqd" type="number" min="0"><input name="image_url"><button>حفظ</button><button type="button">إخفاء/إظهار</button>';f.elements.name_ar.value=p.name_ar;f.elements.price_iqd.value=p.price_iqd??'';f.elements.image_url.value=p.image_url||'';f.onsubmit=async e=>{e.preventDefault();try{await api('/api/technical/products/'+p.id,{method:'PATCH',body:JSON.stringify({name_ar:f.elements.name_ar.value,price_iqd:f.elements.price_iqd.value,image_url:f.elements.image_url.value})});loadProducts()}catch(x){alert(x.message)}};f.querySelector('[type=button]').onclick=async()=>{try{await api('/api/technical/products/'+p.id,{method:'PATCH',body:JSON.stringify({active:!p.active})});loadProducts()}catch(x){alert(x.message)}};box.append(f);}}catch(e){box.textContent=e.message}}
$('#new-product').onsubmit=async e=>{e.preventDefault();try{await postForm(e.currentTarget,'/api/technical/products');e.currentTarget.reset();loadProducts()}catch(x){alert(x.message)}};
async function loadAreas(){const box=$('#areas');try{const rows=await api('/api/technical/areas');box.replaceChildren();for(const a of rows){const f=document.createElement('form');f.className='line';f.innerHTML=`<span>${a.name_ar} — ${a.district}</span><input name="fee" type="number" min="0" placeholder="يحدد لاحقاً"><span>${a.active?'مفعلة':'مخفية'}</span><button>حفظ</button>`;f.elements.fee.value=a.delivery_fee_iqd??'';f.onsubmit=async e=>{e.preventDefault();try{await api('/api/technical/areas/'+a.id,{method:'PATCH',body:JSON.stringify({delivery_fee_iqd:f.elements.fee.value===''?null:Number(f.elements.fee.value)})});loadAreas()}catch(x){alert(x.message)}};box.append(f)}}catch(e){box.textContent=e.message}}
$('#new-area').onsubmit=async e=>{e.preventDefault();try{await postForm(e.currentTarget,'/api/technical/areas');e.currentTarget.reset();loadAreas()}catch(x){alert(x.message)}};async function loadAudit(){const box=$('#pane-audit');try{const rows=await api('/api/technical/audit');box.replaceChildren();for(const x of rows){const p=document.createElement('p');p.textContent=`${x.created_at} — ${x.action} — ${x.details_json}`;box.append(p)}}catch(e){box.textContent=e.message}}init().catch(error);
</script></body></html>
