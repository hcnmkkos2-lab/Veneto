services:
  - type: web
    name: veneto-menu
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: veneto-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: SESSION_SECRET
        generateValue: true
      - key: VENETO_SETUP_TOKEN
        generateValue: true
      - key: OWNER_EMAIL
        sync: false
